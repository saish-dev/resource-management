# Local development: db, redis, api and web. `docker compose up -d db redis`
# starts infra only (run api/web on the host with `pnpm dev`).
name: resource-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rm_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-resource_management}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: pnpm --filter api db:deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rm}:${POSTGRES_PASSWORD:-rm_local_only}@db:5432/${POSTGRES_DB:-resource_management}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/repo/apps/api
      - /repo/apps/api/node_modules
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: 3001
      # Containers reach services by compose name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rm}:${POSTGRES_PASSWORD:-rm_local_only}@db:5432/${POSTGRES_DB:-resource_management}?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules

volumes:
  db_data:
  redis_data:
