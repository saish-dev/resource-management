# Local development infrastructure. App services (api, web) are added by the
# /docker-local skill once apps/api and apps/web exist.
name: resource-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rm_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-resource_management}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
